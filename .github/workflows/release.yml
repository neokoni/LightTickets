name: Release builds

on:
  release:
    types: [published]

jobs:
  web:
    name: Package web.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        working-directory: frontend
        run: npm i

      - name: Build
        working-directory: frontend
        env:
          LT_WEB_API_URL: /api
          LT_GIT_COMMIT: ${{ github.sha }}
          LT_GIT_TAG: ${{ github.event.release.tag_name }}
        run: npm run build

      - name: Package web.zip
        working-directory: frontend
        run: |
          cd dist
          zip -r ../LightTickets-web.zip .

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            LightTickets-web.zip

  server:
    name: Package server.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        working-directory: backend
        run: npm i

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Package server.zip
        working-directory: backend
        run: |
          mkdir -p release
          cp -r dist/. release/
          rm -rf release/data
          cp package-lock.json release/
          cd release
          zip -r ../LightTickets-server.zip .

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            LightTickets-server.zip

  docker:
    name: Docker ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: ./frontend
          - component: server
            context: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image names
        id: images
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/lighttickets-${{ matrix.component }}
          DOCKERHUB_IMAGE: neokoni/lighttickets-${{ matrix.component }}
        run: |
          if [[ "${GITHUB_REPOSITORY}" == "neokoni/LightTickets" ]]; then
            echo "images=${GHCR_IMAGE},${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "images=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.repository == 'neokoni/LightTickets'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LT_GIT_COMMIT=${{ github.sha }}
            LT_GIT_TAG=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=docker-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.component }}

  plugin:
    name: Package plugin jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: plugin
        run: ./gradlew build

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            plugin/build/libs/LightTickets-*.jar